experiments:
  - name: original_nc
    agent: wor_nc
    agent_config: pcla_agents/wor_pretrained/nocrash_weights/config_nocrash.yaml
    config_overrides:
      main_model_dir: pcla_agents/wor_pretrained/nocrash_weights/main_model_16.th
      wide_scale: 1.00
      narr_scale: 1.00
      resolution_aware_bn: False
    latencies: [0]
    vehicle_densities: [0, 5, 20]
    pedestrian_densities: [0, 10, 40]
    routes:
      - name: route0
        route: routes/routes_training.xml
        route_id: 0
        sweep_log: outputs/nc_route0.csv
      - name: route1
        route: routes/routes_training.xml
        route_id: 1
        sweep_log: outputs/nc_route1.csv
      - name: route2
        route: routes/routes_devtest.xml
        route_id: 0
        sweep_log: outputs/nc_route2.csv
      - name: route3
        route: routes/routes_devtest.xml
        route_id: 1
        sweep_log: outputs/nc_route3.csv
  - name: bn_r075
    agent: wor_bn
    agent_config: outputs/config_bn.yaml
    config_overrides:
      main_model_dir: outputs/bn_0.75r.th
      wide_scale: 0.75
      narr_scale: 0.75
      resolution_aware_bn: False
    latencies: [0.2, 0.15, 0.1, 0.05, 0]
    vehicle_densities: [0, 5, 20]
    pedestrian_densities: [0, 10, 40]
    routes:
      - name: route0
        route: routes/routes_training.xml
        route_id: 0
        sweep_log: outputs/0.75r_route0.csv
      - name: route1
        route: routes/routes_training.xml
        route_id: 1
        sweep_log: outputs/0.75r_route1.csv
      - name: route2
        route: routes/routes_devtest.xml
        route_id: 0
        sweep_log: outputs/0.75r_route2.csv
      - name: route3
        route: routes/routes_devtest.xml
        route_id: 1
        sweep_log: outputs/0.75r_route3.csv

  - name: bn_r100
