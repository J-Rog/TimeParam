    agent_config: outputs/config_bn.yaml
    config_overrides:
      main_model_dir: outputs/resaware_bn_finetuned.th
      resolution_aware_bn: True
    extra_args:
      - --lane-wide-scale
      - "0.75"
      - --lane-narr-scale
      - "0.75"
      - --traffic-light-wide-scale
      - "1.0"
      - --traffic-light-narr-scale
      - "1.0"
      - --traffic-light-latency
      - "0.15"
      - --traffic-light-distance
      - "5.0"
    latencies: [0.1]
    vehicle_densities: [0, 5, 20]
    pedestrian_densities: [0, 10, 40]
    routes:
      - name: route0
        route: routes/routes_training.xml
        route_id: 0
        sweep_log: outputs/0.1to0.15r_resaware_route0.csv
      - name: route1
        route: routes/routes_training.xml
        route_id: 1
        sweep_log: outputs/0.1to0.15r_resaware_route1.csv
      - name: route2
        route: routes/routes_devtest.xml
        route_id: 0
        sweep_log: outputs/0.1to0.15r_resaware_route2.csv
      - name: route3
        route: routes/routes_devtest.xml
        route_id: 1
        sweep_log: outputs/0.1to0.15r_resaware_route3.csv
    
