    latencies: [0.2, 0.15, 0.1, 0.05, 0]
    vehicle_densities: [0, 5, 20]
    pedestrian_densities: [0, 10, 40]
    routes:
      - name: route0
        route: routes/routes_training.xml
        route_id: 0
        sweep_log: outputs/1.00r_route0.csv
      - name: route1
        route: routes/routes_training.xml
        route_id: 1
        sweep_log: outputs/1.00r_route1.csv
      - name: route2
        route: routes/routes_devtest.xml
        route_id: 0
        sweep_log: outputs/1.00r_route2.csv
      - name: route3
        route: routes/routes_devtest.xml
        route_id: 1
        sweep_log: outputs/1.00r_route3.csv

  - name: resaware_r100
    agent: wor_bn
    agent_config: outputs/config_bn.yaml
    config_overrides:
      main_model_dir: outputs/resaware_bn_finetuned.th
      wide_scale: 1.0
      narr_scale: 1.0
      resolution_aware_bn: True
    latencies: [0.2, 0.15, 0.1, 0.05, 0]
    vehicle_densities: [0, 5, 20]
    pedestrian_densities: [0, 10, 40]
    routes:
      - name: route0
        route: routes/routes_training.xml
        route_id: 0
        sweep_log: outputs/1.0r_resaware_route0.csv
      - name: route1
