        route_id: 0
        sweep_log: outputs/1.0r_resaware_route2.csv
      - name: route3
        route: routes/routes_devtest.xml
        route_id: 1
        sweep_log: outputs/1.0r_resaware_route3.csv

  - name: resaware_r075
    agent: wor_bn
    agent_config: outputs/config_bn.yaml
    config_overrides:
      main_model_dir: outputs/resaware_bn_finetuned.th
      wide_scale: 0.75
      narr_scale: 0.75
      resolution_aware_bn: True
    latencies: [0.2, 0.15, 0.1, 0.05, 0]
    vehicle_densities: [0, 5, 20]
